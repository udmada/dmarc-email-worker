[tools]
hk = "latest"
node = "lts"
pnpm = "latest"
wrangler = "latest"
pkl = "latest"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start development server"
run = "pnpm start"

[tasks.pretty]
description = "Check code formatting"
run = "pnpm pretty"

[tasks.lint]
description = "Lint source code"
run = "pnpm lint"

[tasks.test]
description = "Run format check and lint"
run = "pnpm test"

[tasks."generate:pkl"]
description = "Generate wrangler.json for UI from Pkl"
run = "pkl eval --format json pkl/ui.pkl -o ui/wrangler.json"

[tasks."dev:worker"]
description = "Start email worker dev server"
run = "wrangler dev"

[tasks."dev:ui"]
description = "Start Astro UI dev server"
dir = "ui"
run = "pnpm dev"

[tasks."deploy:worker"]
description = "Deploy email worker"
run = "wrangler deploy"

[tasks."deploy:ui"]
description = "Build and deploy Astro UI"
depends = ["generate:pkl"]
dir = "ui"
run = "pnpm build && wrangler deploy"

[tasks.deploy]
description = "Deploy all (worker + UI)"
depends = ["deploy:worker", "deploy:ui"]
